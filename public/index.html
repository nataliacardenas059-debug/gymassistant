<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>GymAssistant</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-body">

    <div class="login-wrapper">

        <div class="login-card">
            <h2>🏋️ GymAssistant</h2>
            <p>Acceso al sistema</p>

            <input type="text" id="correo" placeholder="Correo institucional">

            <button onclick="login()" class="btn-primary">Ingresar</button>

            <p id="error"></p>
        </div>

    </div>

    <script>
        function login() {
            const correo = document.getElementById("correo").value;

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo })
            })
                .then(res => res.json())
                .then(user => {

                    if (user.mensaje) {
                        document.getElementById("error").innerText = user.mensaje;
                        return;
                    }

                    localStorage.setItem("rol", user.rol);
                    localStorage.setItem("id", user.id);

                    if (user.rol === "admin") {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "usuario.html";
                    }
                });
        }
    </script>

</body>

</html>

</html>
