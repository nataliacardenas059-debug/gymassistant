<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>GymAssistant</title>
    <link rel="stylesheet" href="stylesLogin.css">
</head>

<body class="login-body">

    <div class="login-wrapper">

        <div class="login-card">
            <h2>🏋️ GymAssistant</h2>
            <p>Acceso al sistema</p>

            <input type="text" id="correo" placeholder="Correo institucional">
            <input type="password" id="password" placeholder="Contraseña">

            <button onclick="login()" class="btn-primary">Ingresar</button>

            <p id="error"></p>
        </div>

    </div>

    <script>

        async function login() {

            const correo =
                document.getElementById(
                    "correo"
                ).value;

            const password =
                document.getElementById(
                    "password"
                ).value;

            const res =
                await fetch('/api/auth/login', {

                    method: 'POST',

                    headers: {

                        'Content-Type':
                            'application/json'
                    },

                    body: JSON.stringify({

                        correo,
                        password
                    })
                });

            const user =
                await res.json();

            // ❌ ERROR

            if (user.mensaje) {

                document
                    .getElementById("error")
                    .innerText =
                    user.mensaje;

                return;
            }

            // 🟡 PRIMER INGRESO

            if (user.primerIngreso) {

                const nuevaPassword =
                    prompt(

                        "Es tu primer ingreso.\n\nCrea una contraseña:"
                    );

                if (!nuevaPassword) {

                    return;
                }

                const crear =
                    await fetch(
                        '/api/auth/crear-password',

                        {

                            method: 'POST',

                            headers: {

                                'Content-Type':
                                    'application/json'
                            },

                            body: JSON.stringify({

                                id: user.id,

                                password:
                                    nuevaPassword
                            })
                        }
                    );

                const resultado =
                    await crear.json();

                if (resultado.success) {

                    alert(
                        "Contraseña creada correctamente"
                    );

                    location.reload();
                }

                return;
            }

            // ✅ LOGIN EXITOSO

            localStorage.setItem(
                "rol",
                user.rol
            );

            localStorage.setItem(
                "id",
                user.id
            );

            // SESIÓN

            localStorage.setItem(
                "sesionActiva",
                true
            );

            if (user.rol === "admin") {

                window.location.href =
                    "admin.html";

            } else {

                window.location.href =
                    "usuario.html";
            }
        }

    </script>

</body>

</html>

</html>
