<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Cuenta</title>

    <link rel="stylesheet" href="stylesUsuario.css">
    </link>

</head>

<body>

    <script>

        const rol = localStorage.getItem("rol");

        if (!rol) {

            window.location.href =
                "index.html";
        }

    </script>

    <div class="layout">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h2>🏋️ GymAssistant</h2>

            <button class="nav-btn active" onclick="mostrarUser('inicio', this)">
                🏠 Inicio
            </button>

            <button class="nav-btn" onclick="mostrarUser('membresia', this)">
                💳 Mi Membresía
            </button>

            <button class="nav-btn" onclick="mostrarUser('aforo', this)">
                👥 Aforo
            </button>

            <button class="nav-btn" onclick="mostrarUser('ingresos', this)">
                📋 Mis Ingresos
            </button>

            <button class="nav-btn" onclick="toggleModo()">
                🌙 Modo
            </button>

            <div class="logout">

                <button class="btn-logout" onclick="logout()">
                    Cerrar sesión
                </button>

            </div>

        </aside>

        <!-- MAIN -->

        <main class="main">

            <div class="top-user">

                <h1>Mi Cuenta</h1>

                <p>
                    Consulta tu información del gimnasio
                </p>

            </div>

            <!-- INICIO -->

            <section id="inicio" class="section">

                <div class="welcome-card">

                    <h2>
                        Bienvenido a GymAssistant
                    </h2>

                    <p>
                        Gestiona tu membresía,
                        revisa tus ingresos
                        y consulta el aforo
                        del gimnasio.
                    </p>
                    <button class="btn-secondary" onclick="registrarSalida()">
                        Registrar salida
                    </button>

                </div>

            </section>

            <!-- MEMBRESÍA -->

            <section id="membresia" class="section hidden">

                <h2>Mi Membresía</h2>

                <div id="info"></div>

            </section>

            <!-- AFORO -->

            <section id="aforo" class="section hidden">

                <h2>Aforo Actual</h2>

                <div class="card-user">

                    <h3 id="aforoActual">
                        Cargando...
                    </h3>

                </div>

            </section>

            <!-- INGRESOS -->

            <section id="ingresos" class="section hidden">

                <h2>Mis Ingresos</h2>
                <div id="tablaIngresos"></div>
            </section>

        </main>

    </div>

    <script>

        const id =
            localStorage.getItem("id");

        // FORMATEAR FECHA

        function formatearFecha(fecha) {

            if (!fecha) return "N/A";

            const f = new Date(fecha);

            return f.toLocaleDateString(

                "es-CO",

                {

                    year: "numeric",

                    month: "long",

                    day: "numeric"
                }
            );
        }

        // DÍAS RESTANTES

        function calcularDiasRestantes(
            fechaFin
        ) {

            if (!fechaFin) return null;

            const hoy = new Date();

            const fin =
                new Date(fechaFin);

            const diff = Math.ceil(

                (fin - hoy)

                /

                (1000 * 60 * 60 * 24)
            );

            return diff;
        }

        // CARGAR MEMBRESÍA

        function cargarMembresia() {

            fetch(

                '/api/membresias/' + id

            )

                .then(res => res.json())

                .then(data => {

                    const contenedor =
                        document.getElementById(
                            "info"
                        );

                    if (data.mensaje) {

                        contenedor.innerHTML = `

                    <div class="card-user">

                        <p>${data.mensaje}</p>

                    </div>

                `;

                        return;
                    }

                    let color = "#f59e0b";

                    if (
                        data.estado === "Activa"
                    ) {

                        color = "#22c55e";
                    }

                    if (
                        data.estado === "Inactiva"
                    ) {

                        color = "#ef4444";
                    }

                    let extraInfo = "";

                    // MENSUAL

                    if (data.fecha_fin) {

                        const dias =
                            calcularDiasRestantes(
                                data.fecha_fin
                            );

                        if (dias > 0) {

                            extraInfo += `

                        <p>

                            ⏳ Te quedan
                            <strong>${dias}</strong>
                            días

                        </p>

                    `;

                        } else {

                            extraInfo += `

                        <p style="color:#ef4444;">

                            Membresía vencida

                        </p>

                    `;
                        }
                    }

                    // CHEQUERA

                    if (

                        data.dias_restantes !==
                        undefined

                        &&

                        data.dias_restantes !==
                        null

                    ) {

                        extraInfo += `

                    <p>

                        🎟️ Días disponibles:

                        <strong>
                            ${data.dias_restantes}
                        </strong>

                    </p>

                `;
                    }

                    contenedor.innerHTML = `

                <div
                    class="card-user"
                    style="
                    border-left:
                    6px solid ${color}"
                >

                    <h3>
                        Estado:
                        <span style="
                        color:${color}">
                        ${data.estado}
                        </span>
                    </h3>

                    <p>

                        <strong>Inicio:</strong>

                        ${formatearFecha(
                        data.fecha_inicio
                    )}

                    </p>

                    <p>

                        <strong>Fin:</strong>

                        ${formatearFecha(
                        data.fecha_fin
                    )}

                    </p>

                    ${extraInfo}

                    ${data.comprobante

                            ?

                            `

                        <a
                            class="btn-secondary"
                            href="/uploads/${data.comprobante}"
                            target="_blank"
                        >

                            📄 Ver comprobante

                        </a>

                        `

                            :

                            ""
                        }

                </div>

            `;
                });
        }

        // AFORO
        function cargarAforo() {

            fetch('/api/acceso/aforo')

                .then(res => res.json())

                .then(data => {

                    document.getElementById(
                        "aforoActual"
                    ).innerHTML = `

            👥 ${data.total}
            personas actualmente
        `;
                });
        }

        //HISTORIAL
        function cargarHistorial() {
            fetch(
                '/api/acceso/historial/' + id
            )
                .then(res => res.json())
                .then(data => {
                    const contenedor =
                        document.getElementById(
                            "tablaIngresos"
                        );

                    if (!data.length) {

                        contenedor.innerHTML = `

                <div class="card-user">
                    No tienes ingresos registrados

                </div>
            `;
                        return;
                    }
                    let html = `
            <table>
                <thead>
                    <tr>
                        <th>Ingreso</th>
                        <th>Salida</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
        `;
                    data.forEach(registro => {
                        html += `

                <tr>
                    <td>
                        ${formatearFecha(
                            registro.fecha_hora
                        )}

                    </td>
                    <td>
                        ${registro.fecha_salida
                                ?
                                formatearFecha(
                                    registro.fecha_salida
                                )
                                :
                                'Dentro del gimnasio'
                            }

                    </td>
                    <td>
                        ${registro.estado}
                    </td>
                </tr>
            `;
                    });
                    html += `
                </tbody>
            </table>
        `;
                    contenedor.innerHTML =
                        html;
                });
        }

        // NAV

        function mostrarUser(
            seccion,
            btn
        ) {

            document
                .querySelectorAll('.section')

                .forEach(s =>

                    s.classList.add('hidden')
                );

            document
                .getElementById(seccion)

                .classList.remove('hidden');

            document
                .querySelectorAll('.nav-btn')

                .forEach(b =>

                    b.classList.remove('active')
                );

            btn.classList.add('active');

            if (seccion === "membresia") {
                cargarMembresia();
            }

            if (seccion === "aforo") {
                cargarAforo();
            }

            if (seccion === "ingresos") {
                cargarHistorial();
            }
        }

        // LOGOUT

        function logout() {

            localStorage.clear();

            window.location.href =
                "index.html";
        }

        //SALIR
        function registrarSalida() {
            fetch(
                '/api/acceso/salida/' + id,
                {
                    method: 'PUT'
                }
            )
                .then(res => res.json())
                .then(data => {
                    alert(
                        data.mensaje ||
                        'Salida registrada'
                    );
                });
        }

        // MODO

        function toggleModo() {

            document.body.classList.toggle(
                "light"
            );
        }

        // SESIÓN AUTOMÁTICA

        let tiempoInactividad;

        function reiniciarTemporizador() {

            clearTimeout(
                tiempoInactividad
            );

            tiempoInactividad =
                setTimeout(() => {

                    alert(
                        "Sesión expirada"
                    );

                    logout();

                }, 300000);
        }

        document.onload =
            reiniciarTemporizador;

        document.onmousemove =
            reiniciarTemporizador;

        document.onkeypress =
            reiniciarTemporizador;

        // INIT

        window.onload = () => {

            mostrarUser(

                'inicio',

                document.querySelector(
                    '.nav-btn'
                )
            );

            cargarAforo();
        };

    </script>

</body>

</html>
