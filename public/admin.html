<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Assistant</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                <h2>Gym Assistant</h2>
            </div>

            <nav>

                <button class="menu-btn active" onclick="mostrarModulo('dashboard')">
                    Dashboard
                </button>

                <button class="menu-btn" onclick="mostrarModulo('usuarios')">
                    Usuarios
                </button>

                <button class="menu-btn" onclick="mostrarModulo('membresias')">
                    Membresías
                </button>

                <button class="menu-btn" onclick="mostrarModulo('acceso')">
                    Acceso
                </button>

            </nav>

        </aside>

        <!-- CONTENIDO -->
        <main class="contenido">

            <!-- DASHBOARD -->
            <section id="dashboard" class="modulo activo">

                <h1>Dashboard</h1>

                <div class="cards-dashboard">

                    <div class="card-dashboard">
                        <h3>Aforo Actual</h3>
                        <p id="aforoActual">0</p>
                    </div>

                    <div class="card-dashboard">
                        <h3>Espacios Disponibles</h3>
                        <p id="espaciosDisponibles">30</p>
                    </div>

                </div>

            </section>

            <!-- USUARIOS -->
            <section id="usuarios" class="modulo">

                <div class="header-modulo">

                    <h1>Usuarios</h1>

                    <div class="acciones-usuarios">

                        <input type="text" id="buscadorUsuarios" placeholder="Buscar usuario..."
                            onkeyup="filtrarUsuarios()">

                        <button onclick="abrirModalUsuario()">
                            + Nuevo Usuario
                        </button>

                    </div>

                </div>

                <div class="tabla-container">

                    <table>

                        <thead>

                            <tr>
                                <th>Nombre</th>
                                <th>Documento</th>
                                <th>Tipo</th>
                                <th>Correo</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>

                        </thead>

                        <tbody id="tablaUsuarios">

                        </tbody>

                    </table>

                </div>

            </section>

            <!-- MEMBRESIAS -->
            <section id="membresias" class="modulo">

                <div class="header-modulo">

                    <h1>Membresías</h1>

                    <div class="acciones-usuarios">

                        <button onclick="mostrarSubModuloMembresia('registrar')">
                            Registrar
                        </button>

                        <button onclick="mostrarSubModuloMembresia('consultar')">
                            Consultar
                        </button>

                    </div>

                </div>

                <!-- REGISTRAR -->
                <div id="subRegistrarMembresia" class="submodulo-membresia activo-sub">

                    <div class="form-grid">

                        <input type="text" id="docMembresia" placeholder="Documento usuario">

                        <select id="tipoMembresia" onchange="cambiarCamposMembresia()">

                            <option value="mensual">
                                Mensual
                            </option>

                            <option value="chequera">
                                Chequera
                            </option>

                        </select>

                        <input type="date" id="fechaInicio">

                        <div id="grupoDiasChequera">

                            <input type="number" id="diasChequera" placeholder="Días chequera">

                        </div>
                        <input type="file" id="comprobanteArchivo" accept=".pdf,image/*">

                        <button onclick="crearMembresia()">
                            Registrar Membresía
                        </button>

                    </div>

                </div>

                <!-- CONSULTAR -->
                <div id="subConsultarMembresia" class="submodulo-membresia">

                    <div class="header-modulo">

                        <h2>Consultar Membresías</h2>

                        <button onclick="cargarMembresias()">
                            Actualizar
                        </button>

                    </div>

                    <div class="tabla-container">

                        <table>

                            <thead>

                                <tr>

                                    <th>Usuario</th>
                                    <th>Tipo</th>
                                    <th>Estado</th>
                                    <th>Inicio</th>
                                    <th>Fin</th>
                                    <th>Días</th>
                                    <th>Comprobante</th>

                                </tr>

                            </thead>

                            <tbody id="tablaMembresias">

                            </tbody>

                        </table>

                    </div>

                </div>

            </section>

            <!-- ACCESO -->
            <section id=" acceso" class="modulo">

                <h1>Control de Acceso</h1>

                <div class="acceso-box">

                    <input type="text" id="docAcceso" placeholder="Documento usuario">

                    <button onclick="consultarAcceso()">
                        Consultar
                    </button>

                </div>

                <div id="resultadoAcceso"></div>

            </section>

        </main>

    </div>
    <!-- MODAL USUARIO -->
    <div class="modal" id="modalUsuario">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="tituloModal">
                    Nuevo Usuario
                </h2>

                <button class="cerrar-modal" onclick="cerrarModalUsuario()">
                    ✖
                </button>

            </div>

            <div class="form-grid">

                <input type="text" id="nombreCompleto" placeholder="Nombre completo">

                <input type="text" id="numeroDocumento" placeholder="Número documento">

                <select id="tipoDocumento">

                    <option value="CC">Cédula</option>
                    <option value="TI">Tarjeta identidad</option>
                    <option value="CE">Cédula extranjería</option>

                </select>

                <select id="tipoPersona" onchange="cambiarCamposPersona()">

                    <option value="estudiante">
                        Estudiante
                    </option>

                    <option value="profesor">
                        Profesor
                    </option>

                    <option value="administrativo">
                        Administrativo
                    </option>

                </select>

                <!-- CAMPOS PROFESOR -->
                <div id="camposProfesor">

                    <select id="tipoProfesor">

                        <option value="vinculado">
                            Vinculado
                        </option>

                        <option value="externo">
                            Externo
                        </option>

                    </select>

                    <input type="number" id="horasSemana" placeholder="Horas bienestar" value="0">

                </div>

            </div>

            <div class="acciones-modal">

                <button onclick="guardarUsuario()">
                    Guardar Usuario
                </button>

            </div>

        </div>

    </div>

    <script src="admin.js"></script>

</body>

</html>
